<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lesson_42 Class extends</title>
        <link rel="stylesheet" href="./scss/style.css">
    </head>
    <body>
        <header class="header">
            <h1 class="header__title">Class extends from Ivan Vasylenko!</h1>
        </header>
        <main class="main">
            <form method="get" class="form">

                <input type="text" placeholder="Your name..."
                    data-properties="name">
                <input type="number" placeholder="Your age..."
                    data-properties="age">
                <input type="password" placeholder="Your password..."
                    data-properties="password">
                <input type="mail" placeholder="Your mail..."
                    data-properties="mail">
                <input type="text" placeholder="Your city..."
                    data-properties="city">
                <button type="submit">Send</button>
            </form>
            <section class="buttons" id="all-buttons">

            </section>
            <section class="new-button">
                <button id="newButton" style="display: none;"></button>
            </section>
        </main>

        <script src="./js/class_extends.js"></script>
    </body>
</html>
